<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <meta
      name="description"
      content="点击圆圈，让它消失后在新的位置再次出现。"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2307111f'/%3E%3Ccircle cx='32' cy='32' r='15' fill='%23ff5c7a'/%3E%3C/svg%3E"
    />
    <title>点一下</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-rounded, "SF Pro Rounded", "PingFang SC", "Microsoft YaHei",
          system-ui, sans-serif;
        background: #07111f;
        color: #f4f7fb;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-width: 320px;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background:
          radial-gradient(circle at 50% 42%, rgba(40, 86, 128, 0.2), transparent 33rem),
          linear-gradient(145deg, #07111f 0%, #091827 58%, #06101d 100%);
      }

      .stage {
        position: relative;
        width: 100%;
        height: 100dvh;
        isolation: isolate;
        overflow: hidden;
      }

      .stage::before {
        position: absolute;
        inset: 0;
        z-index: -1;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
        background-size: 48px 48px;
        content: "";
        mask-image: linear-gradient(to bottom, black, transparent 82%);
      }

      .intro {
        position: absolute;
        top: clamp(1.5rem, 5vh, 3.5rem);
        left: 50%;
        width: min(90vw, 30rem);
        text-align: center;
        transform: translateX(-50%);
        pointer-events: none;
      }

      .intro h1 {
        margin: 0;
        font-size: clamp(1.15rem, 2.2vw, 1.5rem);
        font-weight: 650;
        letter-spacing: 0.08em;
      }

      .intro p {
        margin: 0.55rem 0 0;
        color: #8da3ba;
        font-size: 0.9rem;
        letter-spacing: 0.03em;
      }

      .target {
        position: absolute;
        top: 50%;
        left: 50%;
        width: clamp(4.75rem, 11vw, 6.5rem);
        aspect-ratio: 1;
        padding: 0;
        border: 0;
        border-radius: 50%;
        outline: none;
        cursor: pointer;
        transform: translate(-50%, -50%) scale(1);
        background:
          radial-gradient(circle at 34% 28%, #ffb3c2 0 5%, transparent 6%),
          radial-gradient(circle at 36% 30%, #ff8ea4 0%, #ff5c7a 44%, #df3158 100%);
        box-shadow:
          0 0 0 0.45rem rgba(255, 92, 122, 0.1),
          0 1.3rem 3.5rem rgba(255, 57, 96, 0.35),
          inset -0.5rem -0.7rem 1.2rem rgba(129, 12, 47, 0.25),
          inset 0.4rem 0.45rem 1rem rgba(255, 255, 255, 0.14);
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        transition:
          opacity 220ms ease,
          transform 260ms cubic-bezier(0.2, 0.85, 0.25, 1.25),
          filter 220ms ease,
          box-shadow 220ms ease;
      }

      .target::after {
        position: absolute;
        inset: -1rem;
        border: 1px solid rgba(255, 124, 149, 0.15);
        border-radius: inherit;
        content: "";
        transition: transform 220ms ease, opacity 220ms ease;
      }

      .target:hover {
        filter: brightness(1.08);
        box-shadow:
          0 0 0 0.6rem rgba(255, 92, 122, 0.13),
          0 1.5rem 4rem rgba(255, 57, 96, 0.45),
          inset -0.5rem -0.7rem 1.2rem rgba(129, 12, 47, 0.25),
          inset 0.4rem 0.45rem 1rem rgba(255, 255, 255, 0.14);
      }

      .target:hover::after {
        transform: scale(1.08);
      }

      .target:focus-visible {
        box-shadow:
          0 0 0 0.25rem #07111f,
          0 0 0 0.5rem #9fd9ff,
          0 1.5rem 4rem rgba(255, 57, 96, 0.45);
      }

      .target.is-leaving {
        opacity: 0;
        filter: blur(0.35rem);
        transform: translate(-50%, -50%) scale(0.08) rotate(14deg);
      }

      .target.is-entering {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.45);
        transition: none;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-height: 520px) {
        .intro {
          top: 1rem;
        }

        .intro p {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .target,
        .target::after {
          transition-duration: 1ms;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage" aria-labelledby="page-title">
      <header class="intro">
        <h1 id="page-title">点一下</h1>
        <p>它会消失，然后在别处回来</p>
      </header>

      <button class="target" type="button" aria-label="点击圆圈"></button>
      <p class="sr-only" aria-live="polite" id="status"></p>
    </main>

    <script>
      const stage = document.querySelector(".stage");
      const target = document.querySelector(".target");
      const status = document.querySelector("#status");
      const prefersReducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)",
      );

      let isMoving = false;

      function moveToRandomPosition() {
        const stageRect = stage.getBoundingClientRect();
        const targetSize = target.getBoundingClientRect().width;
        const edgeGap = Math.max(18, Math.min(stageRect.width, stageRect.height) * 0.04);
        const topSafeZone = stageRect.height < 520 ? 72 : 128;
        const minX = edgeGap + targetSize / 2;
        const maxX = Math.max(minX, stageRect.width - edgeGap - targetSize / 2);
        const minY = Math.min(stageRect.height / 2, topSafeZone + targetSize / 2);
        const maxY = Math.max(minY, stageRect.height - edgeGap - targetSize / 2);

        const x = minX + Math.random() * (maxX - minX);
        const y = minY + Math.random() * (maxY - minY);

        target.style.left = `${x}px`;
        target.style.top = `${y}px`;
      }

      function cycleTarget() {
        if (isMoving) return;

        isMoving = true;
        target.disabled = true;
        target.classList.add("is-leaving");
        status.textContent = "圆圈消失了";

        const leaveDelay = prefersReducedMotion.matches ? 20 : 260;

        window.setTimeout(() => {
          moveToRandomPosition();
          target.classList.remove("is-leaving");
          target.classList.add("is-entering");

          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              target.classList.remove("is-entering");
              target.disabled = false;
              isMoving = false;
              status.textContent = "圆圈在新位置出现了";
            });
          });
        }, leaveDelay);
      }

      target.addEventListener("click", cycleTarget);

      let resizeTimer;
      window.addEventListener("resize", () => {
        window.clearTimeout(resizeTimer);
        resizeTimer = window.setTimeout(moveToRandomPosition, 120);
      });
    </script>
  </body>
</html>
